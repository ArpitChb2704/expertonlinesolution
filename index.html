        const useScrollReveal = () => {
            useEffect(() => {
                const observerOptions = { threshold: 0.1 };
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, observerOptions);

                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        };

                                    <div key={pkg.name} className={`relative flex flex-col rounded-2xl border-2 overflow-hidden transition-all hover:shadow-2xl ${pkg.highlight ? 'border-conversion-orange shadow-xl shadow-conversion-orange/10 scale-105' : 'border-outline-variant'}`}>
                                        {pkg.badge && (
                                            <div class="bg-conversion-orange text-white text-xs font-bold text-center py-2 tracking-widest uppercase">{pkg.badge}</div>
                                        )}
                                        <div className={`p-8 flex-1 flex flex-col ${pkg.highlight ? 'bg-trust-navy text-surface-bright' : 'bg-white'}`}>
                                            <h3 className={`font-headline-md text-headline-md mb-2 ${pkg.highlight ? 'text-white' : 'text-trust-navy'}`}>{pkg.name}</h3>
                                            <p className={`text-sm mb-6 ${pkg.highlight ? 'text-on-primary-container' : 'text-on-surface-variant'}`}>{pkg.description}</p>
                                            <div class="mb-8">
                                                <span className={`text-5xl font-black ${pkg.highlight ? 'text-conversion-orange' : 'text-trust-navy'}`}>${billingCycle === 'monthly' ? pkg.price.monthly : pkg.price.yearly}</span>
                                                <span className={`text-sm ml-1 ${pkg.highlight ? 'text-on-primary-container' : 'text-on-surface-variant'}`}>/mo</span>
                                                {billingCycle === 'yearly' && <div class="text-xs text-success-mint mt-1">Billed annually</div>}
                                            </div>
                                            <ul class="space-y-3 mb-10 flex-1">
                                                {pkg.features.map(f => (
                                                    <li key={f} class="flex items-start gap-3 text-sm">
                                                        <span className={`material-symbols-outlined text-base mt-0.5 flex-shrink-0 ${pkg.highlight ? 'text-success-mint' : 'text-conversion-orange'}`}>check_circle</span>
                                                        <span className={pkg.highlight ? 'text-on-primary-container' : 'text-on-surface-variant'}>{f}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                            <Link
                                                to="/contact"
                                                className={`block w-full text-center py-4 font-cta-text text-cta-text rounded transition-all ${pkg.highlight ? 'bg-conversion-orange text-white hover:brightness-110' : 'border-2 border-trust-navy text-trust-navy hover:bg-trust-navy hover:text-white'}`}
                                            >{pkg.cta}</Link>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Custom Plan Banner */}
                    <section class="py-20 bg-trust-navy text-surface-bright scroll-reveal">
                        <div class="max-w-container-max mx-auto px-gutter text-center">
                            <span class="material-symbols-outlined text-5xl text-conversion-orange mb-6 block">workspace_premium</span>
                            <h2 class="font-headline-lg text-headline-lg mb-4">Need a Custom Plan?</h2>
                            <p class="text-on-primary-container max-w-xl mx-auto mb-8">Every business is different. Let's build a package tailored specifically to your products, goals, and budget.</p>
                            <Link to="/contact" class="inline-flex items-center gap-2 bg-conversion-orange text-white px-10 py-4 font-cta-text text-cta-text hover:brightness-110 transition-all rounded">
                                Talk to an Expert <span class="material-symbols-outlined">arrow_forward</span>
                            </Link>
                        </div>
                    </section>

                    {/* Why Choose Section */}
                    <section class="py-section-gap bg-surface-gray scroll-reveal">
                        <div class="max-w-container-max mx-auto px-gutter">
                            <div class="text-center mb-12">
                                <h2 class="font-headline-lg text-trust-navy mb-4">What's Included in Every Package</h2>
                                <p class="text-on-surface-variant max-w-2xl mx-auto">No hidden fees. No lock-in contracts. Just transparent, results-driven service.</p>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { icon: 'support_agent', title: 'Dedicated Support', desc: 'A real specialist managing your account and answering your queries.' },
                                    { icon: 'verified', title: 'ATES Certified', desc: 'Official Amazon Trained E-Commerce Specialist managing your account.' },
                                    { icon: 'bar_chart', title: 'Regular Reporting', desc: 'Detailed performance reports sent directly to your inbox.' },
                                    { icon: 'lock', title: 'Data Security', desc: 'Your business data is fully protected with enterprise-grade security.' },
                                ].map(item => (
                                    <div key={item.title} class="bg-white p-8 border border-outline-variant rounded-xl hover:border-conversion-orange transition-all">
                                        <span class="material-symbols-outlined text-3xl text-conversion-orange mb-4 block">{item.icon}</span>
                                        <h4 class="font-headline-md text-trust-navy mb-2">{item.title}</h4>
                                        <p class="text-on-surface-variant text-sm">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </main>
            );
        };

        const ContactPage = () => {
            const [submitted, setSubmitted] = useState(false);
            useScrollReveal();

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 3000);
            };

            return (
                <main class="min-h-screen">
                    <section class="bg-trust-navy py-20 text-surface-bright scroll-reveal">
                        <div class="max-w-container-max mx-auto px-gutter">
                            <span class="font-label-caps text-conversion-orange mb-4 block tracking-widest">GET IN TOUCH</span>
                            <h1 class="font-headline-xl text-headline-xl mb-6">Expert Advice Is Just A Message Away.</h1>
                        </div>
                    </section>

                    <section class="max-w-container-max mx-auto px-gutter -mt-16 pb-section-gap relative z-10 scroll-reveal">
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter items-start">
                            <div class="lg:col-span-5 space-y-gutter">
                                <div class="bg-white p-10 border border-outline-variant shadow-sm space-y-8">
                                    <div class="flex items-start gap-4">
                                        <span class="material-symbols-outlined text-conversion-orange text-3xl">phone_in_talk</span>
                                        <div><h3 class="font-headline-md mb-2">Speak With Us</h3><p class="font-bold">+91 9560541200</p></div>
                                    </div>
                                    <div class="flex items-start gap-4">
                                        <span class="material-symbols-outlined text-conversion-orange text-3xl">mail</span>
                                        <div><h3 class="font-headline-md mb-2">Email Inquiry</h3><p class="font-bold">expertecommercesolution2023@gmail.com</p></div>
                                    </div>
                                </div>
                            </div>
                            <div class="lg:col-span-7 bg-white p-10 lg:p-16 border border-outline-variant shadow-sm">
                                <h2 class="font-headline-lg mb-8">Send an Official Inquiry</h2>
                                <form class="space-y-6" onSubmit={handleSubmit}>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <input class="w-full p-4 border border-outline-variant focus:ring-1 focus:ring-trust-navy" placeholder="Full Name" required />
                                        <input class="w-full p-4 border border-outline-variant focus:ring-1 focus:ring-trust-navy" placeholder="Email Address" required type="email" />
                                    </div>
                                    <textarea class="w-full p-4 border border-outline-variant h-32" placeholder="Your Message" required></textarea>
                                    <button 
                                        type="submit"
                                        disabled={submitted}
                                        class={`w-full py-5 font-cta-text flex justify-center items-center gap-3 transition-all ${submitted ? 'bg-success-mint text-trust-navy' : 'bg-conversion-orange text-white hover:brightness-110'}`}
                                    >
                                        {submitted ? (
                                            <React.Fragment><span class="material-symbols-outlined">check_circle</span> SENT</React.Fragment>
                                        ) : (
                                            <React.Fragment>SUBMIT INQUIRY <span class="material-symbols-outlined">send</span></React.Fragment>
                                        )}
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>
                </main>
            );
        };

        // --- App Shell ---
        const App = () => {
            return (
                <MemoryRouter>
                    <ScrollToTop />
                    <Header />
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/about" element={<AboutPage />} />
                        <Route path="/services" element={<ServicesPage />} />
                        <Route path="/packages" element={<PackagesPage />} />
                        <Route path="/contact" element={<ContactPage />} />
                    </Routes>
                    <Footer />
                </MemoryRouter>
            );
        };

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
